# =========================
# API Gateway - application.yml
# =========================

spring:
  application:
    name: api-gateway

  profiles:
    active: local
    include: native

  main:
    allow-bean-definition-overriding: true

  cloud:
    compatibility-verifier:
      enabled: false

    config:
      uri: ${CONFIG_URI:http://localhost:8888}

    gateway:
      mvc:
        routes:
          - id: user-service-docs
            uri: lb://user-service
            predicates:
              - Path=/user-service/v3/api-docs
            filters:
              - RewritePath=/user-service/(?<segment>.*), /${segment}

          - id: user-service-auth
            uri: lb://user-service
            predicates:
              - Path=/api/auth/**

          - id: user-service-users
            uri: lb://user-service
            predicates:
              - Path=/api/users/**

  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8762}

server:
  port: 8763

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
