# =========================
# API Gateway - application.yml
# =========================

spring:
  application:
    name: api-gateway

  profiles:
    active: local
    include: native

  main:
    allow-bean-definition-overriding: true

  cloud:
    compatibility-verifier:
      enabled: false

    config:
      uri: ${CONFIG_URI:http://localhost:8762}

    gateway:
      mvc:
        routes:
          - id: user-service-docs
            uri: lb://user-service
            predicates:
              - Path=/user-service/v3/api-docs
            filters:
              - RewritePath=/user-service/(?<segment>.*), /${segment}

          - id: user-service-auth
            uri: lb://user-service
            predicates:
              - Path=/api/auth/**

          - id: user-service-users
            uri: lb://user-service
            predicates:
              - Path=/api/users/**

          - id: product-service-docs
            uri: lb://product-service
            predicates:
              - Path=/product-service/v3/api-docs
            filters:
              - RewritePath=/product-service/(?<segment>.*), /${segment}

          - id: product-service-products
            uri: lb://product-service
            predicates:
              - Path=/api/products/**

          - id: product-service-categories
            uri: lb://product-service
            predicates:
              - Path=/api/categories/**

          - id: cart-service-docs
            uri: lb://cart-service
            predicates:
              - Path=/cart-service/v3/api-docs
            filters:
              - RewritePath=/cart-service/(?<segment>.*), /${segment}

          - id: cart-service-cart
            uri: lb://cart-service
            predicates:
              - Path=/api/cart/**

          - id: order-service-docs
            uri: lb://order-service
            predicates:
              - Path=/order-service/v3/api-docs
            filters:
              - RewritePath=/order-service/(?<segment>.*), /${segment}

          - id: order-service-orders
            uri: lb://order-service
            predicates:
              - Path=/api/orders/**

          - id: stock-service-docs
            uri: lb://stock-service
            predicates:
              - Path=/stock-service/v3/api-docs
            filters:
              - RewritePath=/stock-service/(?<segment>.*), /${segment}

          - id: stock-service-inventory
            uri: lb://stock-service
            predicates:
              - Path=/api/inventory/**

  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8762}

server:
  port: 8763

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Cart Service
        url: /cart-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Stock Service
        url: /stock-service/v3/api-docs
