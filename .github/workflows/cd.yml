name: CD Backend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - 'cart-service/**'
      - 'config-server/**'
      - 'discover-server/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'product-service/**'
      - 'stock-service/**'
      - 'user-service/**'
      - 'docker-compose.yml'
      - 'prometheus.yml'
      - '.github/workflows/cd.yml'

jobs:
  deploy:
    name: Build images and deploy to EC2
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: 0.0.1-SNAPSHOT
      SERVICES: discover-server config-server api-gateway user-service product-service cart-service order-service stock-service payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and push Docker images with Jib
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          for service in $SERVICES; do
            echo "Building image for ${service}"
            (
              cd "${service}"
              mvn compile jib:build \
                -DskipTests \
                -Djib.to.auth.username="$DOCKERHUB_USERNAME" \
                -Djib.to.auth.password="$DOCKERHUB_TOKEN" \
                --batch-mode
            )
          done

      - name: Render production environment file
        run: |
          set -euo pipefail
          cat > .env.production <<'EOF'
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}

          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}

          RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}

          IYZICO_API_KEY=${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY=${{ secrets.IYZICO_SECRET_KEY }}
          IYZICO_BASE_URL=https://sandbox-api.iyzipay.com

          PRODUCT_SEED_ENABLED=${{ vars.PRODUCT_SEED_ENABLED || 'false' }}
          STOCK_SEED_ENABLED=${{ vars.STOCK_SEED_ENABLED || 'false' }}

          GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GF_AUTH_ANONYMOUS_ENABLED=true
          GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
          GF_SECURITY_ALLOW_EMBEDDING=true
          EOF
          if ! grep -q '^DB_URL=jdbc:' .env.production; then
            echo "::error::DB_URL must start with jdbc:, for example jdbc:postgresql://host:5432/postgres?sslmode=require"
            exit 1
          fi
          chmod 644 .env.production

      - name: Prepare EC2 deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/ecommerce

      - name: Upload compose and environment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,prometheus.yml,.env.production
          target: ~/ecommerce

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            cd ~/ecommerce
            test -f .env.production
            chmod 600 .env.production
            printf %s "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi
            $COMPOSE --env-file .env.production pull

            echo "Starting infrastructure, discovery, and config server first..."
            $COMPOSE --env-file .env.production up -d rabbitmq loki prometheus grafana discovery-server config-server

            echo "Waiting for config-server health..."
            CONFIG_OK=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8762/actuator/health; then
                echo "Config server is healthy on attempt $i"
                CONFIG_OK=true
                break
              fi
              echo "Config server attempt $i failed, retrying in 10s..."
              sleep 10
            done

            if [ "$CONFIG_OK" = "false" ]; then
              echo "Config server health check failed after 30 attempts"
              $COMPOSE --env-file .env.production ps
              $COMPOSE --env-file .env.production logs --tail=120 config-server discovery-server
              exit 1
            fi

            echo "Starting application services..."
            $COMPOSE --env-file .env.production up -d --remove-orphans

            echo "Waiting for api-gateway health..."
            GATEWAY_OK=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health; then
                echo "API gateway is healthy on attempt $i"
                GATEWAY_OK=true
                break
              fi
              echo "API gateway attempt $i failed, retrying in 10s..."
              sleep 10
            done

            $COMPOSE --env-file .env.production ps

            if [ "$GATEWAY_OK" = "false" ]; then
              echo "API gateway health check failed after 30 attempts"
              $COMPOSE --env-file .env.production logs --tail=160 api-gateway config-server cart-service order-service stock-service payment-service
              exit 1
            fi

            echo "Checking Eureka registrations..."
            for service in USER-SERVICE PRODUCT-SERVICE CART-SERVICE ORDER-SERVICE STOCK-SERVICE PAYMENT-SERVICE; do
              SERVICE_OK=false
              for i in $(seq 1 18); do
                if curl -fsS "http://localhost:8761/eureka/apps/${service}" >/dev/null; then
                  echo "${service} is registered in Eureka"
                  SERVICE_OK=true
                  break
                fi
                echo "${service} is not registered yet, retrying in 10s..."
                sleep 10
              done
              if [ "$SERVICE_OK" = "false" ]; then
                echo "${service} did not register in Eureka"
                $COMPOSE --env-file .env.production ps
                $COMPOSE --env-file .env.production logs --tail=120 "$(echo "$service" | tr '[:upper:]' '[:lower:]')"
                exit 1
              fi
            done

            docker image prune -f
            echo "Deployed successfully"

      - name: Slack success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_MESSAGE: "Deployed to EC2 - ${{ github.event.head_commit.message }}"

      - name: Slack failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "Deploy failed - ${{ github.event.head_commit.message }}"
