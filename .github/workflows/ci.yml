name: CI Pipeline

on:
  push:
    branches:
      - develop
      - "feature/**"

jobs:
  validate-and-build:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate commit message format
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          if ! echo "$COMMIT_MSG" | grep -qP '^v\d+\.\d+\.\d+ .+'; then
            echo "❌ Commit must start with vX.Y.Z followed by a space"
            echo "Example: v1.0.0 feat(order-service): add SAGA logic"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build services
        run: |
          for service in $(find . -maxdepth 1 -type d \( -name "*-server" \
            -o -name "*-service" \
            -o -name "*-gateway" \) | sort); do
            if [ -f "$service/pom.xml" ]; then
              echo "🔨 Building $service..."
              cd $service
              mvn clean package -DskipTests --batch-mode
              cd ..
            fi
          done


      - name: Slack — Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_MESSAGE: "✅ CI passed — ${{ github.ref_name }} — ${{ github.event.head_commit.message }}"

      - name: Slack — Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "❌ CI failed — ${{ github.ref_name }} — ${{ github.event.head_commit.message }}"
