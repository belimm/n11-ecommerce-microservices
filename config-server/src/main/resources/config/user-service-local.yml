spring:
  datasource:
    url: ${USER_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/n11bc}}
    username: ${USER_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${USER_DB_PASSWORD:${DB_PASSWORD:1234}}
    hikari:
      maximum-pool-size: ${USER_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${USER_DB_MIN_IDLE:2}
