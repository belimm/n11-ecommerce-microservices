spring:
  datasource:
    url: ${USER_DB_URL:${DB_URL}}
    username: ${USER_DB_USERNAME:${DB_USERNAME}}
    password: ${USER_DB_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${USER_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${USER_DB_MIN_IDLE:2}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
