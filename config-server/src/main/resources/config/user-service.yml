# user-service.yml (config server'da)

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/n11bc
    username: postgres
    password: "1234"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/microservice-realm
          jwk-set-uri: http://localhost:8080/realms/microservice-realm/protocol/openid-connect/certs
  main:
    allow-bean-definition-overriding: true
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"

keycloak:
  token-uri: http://localhost:8080/realms/microservice-realm/protocol/openid-connect/token
  client-id: user-service
  client-secret: wisI6vNCYA1dZFezCkRgWeRjNHPlWdY8
  grant-type-password: password
  grant-type-refresh: refresh_token
  scope: openid offline_access

app:
  refresh-token:
    expiration-ms: 604800000

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false  # her serviste UI'a gerek yok, sadece spec yeterli