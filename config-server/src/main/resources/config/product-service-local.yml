spring:
  datasource:
    url: ${PRODUCT_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/n11bc}}
    username: ${PRODUCT_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${PRODUCT_DB_PASSWORD:${DB_PASSWORD:1234}}
    hikari:
      maximum-pool-size: ${PRODUCT_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${PRODUCT_DB_MIN_IDLE:2}

app:
  seed:
    enabled: ${PRODUCT_SEED_ENABLED:true}
