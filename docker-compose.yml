name: n11-ecommerce

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ecommerce-net

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - ecommerce-net

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}
      GF_SECURITY_ALLOW_EMBEDDING: ${GF_SECURITY_ALLOW_EMBEDDING:-true}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - ecommerce-net

  discovery-server:
    image: ${DOCKERHUB_USERNAME}/discover-server:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_ENABLED: "false"
      EUREKA_HOSTNAME: discovery-server
    networks:
      - ecommerce-net

  config-server:
    image: ${DOCKERHUB_USERNAME}/config-server:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8762:8762"
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_URI: http://discovery-server:8761/eureka
      LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      - discovery-server
      - rabbitmq
      - loki
    networks:
      - ecommerce-net

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
    depends_on:
      - config-server
    networks:
      - ecommerce-net

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
    depends_on:
      - config-server
    networks:
      - ecommerce-net

  product-service:
    image: ${DOCKERHUB_USERNAME}/product-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: product-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
      PRODUCT_SEED_ENABLED: ${PRODUCT_SEED_ENABLED:-false}
    depends_on:
      - config-server
    networks:
      - ecommerce-net

  cart-service:
    image: ${DOCKERHUB_USERNAME}/cart-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: cart-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
    depends_on:
      - config-server
      - rabbitmq
    networks:
      - ecommerce-net

  order-service:
    image: ${DOCKERHUB_USERNAME}/order-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
    depends_on:
      - config-server
      - rabbitmq
      - cart-service
      - user-service
    networks:
      - ecommerce-net

  stock-service:
    image: ${DOCKERHUB_USERNAME}/stock-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: stock-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
      STOCK_SEED_ENABLED: ${STOCK_SEED_ENABLED:-false}
    depends_on:
      - config-server
      - rabbitmq
    networks:
      - ecommerce-net

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: payment-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      CONFIG_URI: http://config-server:8762
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
    depends_on:
      - config-server
      - rabbitmq
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  rabbitmq-data:
  loki-data:
  prometheus-data:
  grafana-data:
